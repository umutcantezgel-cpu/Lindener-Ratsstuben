project_id: "env:CROWDIN_PROJECT_ID"
api_token: "env:CROWDIN_PERSONAL_TOKEN"
base_path: "."
base_url: "https://api.crowdin.com"

preserve_hierarchy: true

files:
  - source: /locales/en/**/*.json
    translation: /locales/%two_letters_code%/**/%original_file_name%
    languages_mapping:
      two_letters_code:
        de: de
        fr: fr
        es: es
        ja: ja
        zh: zh
        pt: pt
        ar: ar
